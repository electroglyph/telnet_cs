name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Format check
        run: dotnet format --verify-no-changes
      - name: Build
        run: dotnet build telnet_cs.sln -c Release --nologo
      - name: Test
        run: dotnet test telnet_cs.sln -c Release --no-build --collect:"XPlat Code Coverage" -p:Threshold=80 -p:ThresholdType=line --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
